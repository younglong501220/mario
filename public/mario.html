<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易瑪利歐小遊戲 - Mini Mario Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; }
        p { margin: 5px 0 15px 0; color: #aaa; }
        canvas {
            background-color: #5c94fc; /* 經典天空藍 */
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .btn-restart {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #e52521;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-restart:hover {
            background-color: #ff3b30;
        }
    </style>
</head>
<body>
    <h1>Mini Mario Platformer</h1>
    <p>控制方式：【← / → 或 A / D】左右移動 |【空白鍵 / ↑ 或 W】跳躍</p>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button class="btn-restart" onclick="restartGame()">重新開始遊戲 (Restart)</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 鍵盤輸入監聽
        const keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // 重力常數
        const GRAVITY = 0.6;

        // 玩家物件
        const player = {
            x: 50,
            y: 250,
            w: 30,
            h: 40,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpStrength: -12.5,
            isGrounded: false,
            score: 0,
            lives: 3
        };

        // 地圖關卡設定
        const platforms = [
            // 地面 (多段)
            { x: 0, y: 350, w: 700, h: 50 },
            { x: 780, y: 350, w: 600, h: 50 },
            { x: 1460, y: 350, w: 800, h: 50 },

            // 浮動磚塊與平台
            { x: 200, y: 260, w: 90, h: 20 },
            { x: 350, y: 200, w: 120, h: 20 },
            { x: 550, y: 240, w: 90, h: 20 },
            { x: 900, y: 260, w: 100, h: 20 },
            { x: 1050, y: 190, w: 120, h: 20 },
            { x: 1250, y: 250, w: 90, h: 20 },
            { x: 1650, y: 280, w: 60, h: 20 },
            { x: 1750, y: 220, w: 60, h: 20 },
            { x: 1850, y: 160, w: 60, h: 20 }
        ];

        // 金幣
        let coins = [
            { x: 230, y: 220, collected: false },
            { x: 400, y: 160, collected: false },
            { x: 580, y: 200, collected: false },
            { x: 950, y: 220, collected: false },
            { x: 1100, y: 150, collected: false },
            { x: 1870, y: 120, collected: false }
        ];

        // 巡邏小怪 (Goomba)
        let enemies = [
            { x: 450, y: 320, w: 30, h: 30, vx: -1.2, alive: true },
            { x: 950, y: 320, w: 30, h: 30, vx: -1.5, alive: true },
            { x: 1120, y: 160, w: 30, h: 30, vx: -1, alive: true },
            { x: 1600, y: 320, w: 30, h: 30, vx: -1.5, alive: true }
        ];

        // 終點旗桿
        const goal = { x: 2100, y: 110, w: 10, h: 240, reached: false };

        let cameraX = 0;
        let gameState = "PLAYING"; // "PLAYING", "WON", "GAMEOVER"

        function resetPlayer() {
            player.x = 50;
            player.y = 250;
            player.vx = 0;
            player.vy = 0;
        }

        function restartGame() {
            player.lives = 3;
            player.score = 0;
            resetPlayer();
            gameState = "PLAYING";
            coins.forEach(c => c.collected = false);
            enemies = [
                { x: 450, y: 320, w: 30, h: 30, vx: -1.2, alive: true },
                { x: 950, y: 320, w: 30, h: 30, vx: -1.5, alive: true },
                { x: 1120, y: 160, w: 30, h: 30, vx: -1, alive: true },
                { x: 1600, y: 320, w: 30, h: 30, vx: -1.5, alive: true }
            ];
            goal.reached = false;
        }

        // AABB 碰撞檢測輔助
        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.w &&
                r1.x + r1.w > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.h > r2.y
            );
        }

        function update() {
            if (gameState !== "PLAYING") return;

            // 1. 水平移動處理
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -player.speed;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            // 2. 跳躍
            if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.isGrounded) {
                player.vy = player.jumpStrength;
                player.isGrounded = false;
            }

            // 3. 重力
            player.vy += GRAVITY;

            // 4. 水平碰撞檢測
            player.x += player.vx;
            platforms.forEach((p) => {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.w;
                    else if (player.vx < 0) player.x = p.x + p.w;
                }
            });

            // 5. 垂直碰撞檢測
            player.y += player.vy;
            player.isGrounded = false;
            platforms.forEach((p) => {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) { // 下降時踩在平台上
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.isGrounded = true;
                    } else if (player.vy < 0) { // 向上頂到磚塊
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            });

            // 掉入深淵判定
            if (player.y > canvas.height + 100) {
                player.lives--;
                if (player.lives <= 0) {
                    gameState = "GAMEOVER";
                } else {
                    resetPlayer();
                }
            }

            // 6. 敵人更新與碰撞
            enemies.forEach((enemy) => {
                if (!enemy.alive) return;

                enemy.x += enemy.vx;
                // 碰到邊緣反向 (簡易判定)
                if (enemy.x < 0 || enemy.x > 2300) enemy.vx *= -1;

                // 與玩家碰撞
                if (checkCollision(player, enemy)) {
                    // 從上方踩踏 (玩家正在下墜，且底部高於怪物中心)
                    if (player.vy > 0 && (player.y + player.h - player.vy) <= enemy.y + 15) {
                        enemy.alive = false;
                        player.vy = player.jumpStrength * 0.7; // 小反彈
                        player.score += 100;
                    } else {
                        // 受傷
                        player.lives--;
                        if (player.lives <= 0) {
                            gameState = "GAMEOVER";
                        } else {
                            resetPlayer();
                        }
                    }
                }
            });

            // 7. 金幣收集
            coins.forEach((coin) => {
                if (!coin.collected) {
                    const hit = checkCollision(player, { x: coin.x, y: coin.y, w: 16, h: 16 });
                    if (hit) {
                        coin.collected = true;
                        player.score += 50;
                    }
                }
            });

            // 8. 終點檢測
            if (checkCollision(player, goal)) {
                gameState = "WON";
            }

            // 9. 攝影機跟隨
            cameraX = player.x - 200;
            if (cameraX < 0) cameraX = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // 畫雲朵背景裝飾
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(200 * i + 100, 70, 25, 0, Math.PI * 2);
                ctx.arc(200 * i + 130, 60, 35, 0, Math.PI * 2);
                ctx.arc(200 * i + 160, 70, 25, 0, Math.PI * 2);
                ctx.fill();
            }

            // 繪製平台/磚塊
            platforms.forEach((p) => {
                ctx.fillStyle = "#8b4513"; // 磚石棕
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // 頂部綠草皮邊框
                ctx.fillStyle = "#00aa00";
                ctx.fillRect(p.x, p.y, p.w, 6);
            });

            // 繪製金幣
            coins.forEach((coin) => {
                if (!coin.collected) {
                    ctx.fillStyle = "#ffd700";
                    ctx.beginPath();
                    ctx.arc(coin.x + 8, coin.y + 8, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#b8860b";
                    ctx.stroke();
                }
            });

            // 繪製小怪
            enemies.forEach((enemy) => {
                if (enemy.alive) {
                    ctx.fillStyle = "#a52a2a"; // 栗子棕
                    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                    // 眼睛
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(enemy.x + 5, enemy.y + 6, 6, 8);
                    ctx.fillRect(enemy.x + 19, enemy.y + 6, 6, 8);
                    ctx.fillStyle = "#000";
                    ctx.fillRect(enemy.x + 7, enemy.y + 8, 3, 4);
                    ctx.fillRect(enemy.x + 21, enemy.y + 8, 3, 4);
                }
            });

            // 繪製終點旗桿
            ctx.fillStyle = "#fff";
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.fillStyle = "#2ecc71"; // 旗幟綠
            ctx.beginPath();
            ctx.moveTo(goal.x + goal.w, goal.y);
            ctx.lineTo(goal.x + goal.w + 40, goal.y + 20);
            ctx.lineTo(goal.x + goal.w, goal.y + 40);
            ctx.fill();

            // 繪製玩家 (經典紅藍配色)
            ctx.fillStyle = "#e52521"; // 紅帽子/上衣
            ctx.fillRect(player.x, player.y, player.w, player.h * 0.5);
            ctx.fillStyle = "#0026ff"; // 藍色吊帶褲
            ctx.fillRect(player.x, player.y + player.h * 0.5, player.w, player.h * 0.5);

            ctx.restore();

            // UI 介面資訊 (固定在螢幕上，不受攝影機影響)
            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px monospace";
            ctx.fillText(`SCORE: ${player.score}`, 20, 30);
            ctx.fillText(`LIVES: ${player.lives}`, 20, 60);

            // 遊戲結束或獲勝文字
            if (gameState === "WON") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffff00";
                ctx.font = "bold 42px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🎉 恭喜通關！ 🎉", canvas.width / 2, 200);
                ctx.font = "20px sans-serif";
                ctx.fillText("點擊下方按鈕或重新整理即可再玩一次", canvas.width / 2, 240);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 42px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 200);
                ctx.font = "20px sans-serif";
                ctx.fillText("點擊下方按鈕或重新整理再試一次！", canvas.width / 2, 240);
            }
        }

        // 主遊戲循環
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
